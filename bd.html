<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bases de datos - Proveedores</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border: 1px solid #ccc;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      border-radius: 10px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .header h1 {
      color: #333;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .viewer-wrap {
      border: 1px solid #d3d3d3;
      border-radius: 10px;
      overflow: hidden;
      background: #fafafa;
      min-height: 70vh;
      padding: 12px;
    }

    .sheet-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .sheet-tab {
      border: 1px solid #ccc;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .sheet-tab.active {
      background: #007bff;
      border-color: #007bff;
      color: #fff;
    }

    .sheet-content {
      overflow: auto;
      max-height: calc(70vh - 30px);
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
    }

    .sheet-content table {
      border-collapse: collapse;
      font-size: 12px;
    }

    .sheet-content td,
    .sheet-content th {
      border: 1px solid #d5d5d5;
      padding: 4px 6px;
      white-space: nowrap;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      text-decoration: none;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .status {
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .status.loading {
      display: block;
      background: #d1ecf1;
      color: #0c5460;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    .backend-alert {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: min(420px, calc(100vw - 24px));
      background: #fff;
      border: 1px solid #f2c4c4;
      border-left: 6px solid #c62828;
      border-radius: 10px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.22);
      z-index: 11000;
      display: none;
    }

    .backend-alert.active {
      display: block;
    }

    .backend-alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 6px;
    }

    .backend-alert-title {
      font-size: 14px;
      font-weight: 700;
      color: #7a1212;
    }

    .backend-alert-close {
      border: none;
      background: transparent;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      color: #666;
    }

    .backend-alert-body {
      padding: 0 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: #2d2d2d;
    }

    .backend-alert-help {
      background: #fdf4f4;
      border: 1px solid #efcaca;
      border-radius: 8px;
      padding: 8px;
      color: #5e2020;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Bases de datos</h1>
        <div class="subtitle">Archivo: CORREGIDO_Maestro Proveedores.xlsx</div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="back-btn">Volver</button>
        <button class="btn" id="open-drive-btn">Abrir en Drive</button>
      </div>
    </div>

    <div id="status" class="status loading">Buscando el Excel en Drive...</div>

    <div class="backend-alert" id="backend-alert">
      <div class="backend-alert-header">
        <div class="backend-alert-title" id="backend-alert-title">Aviso del backend</div>
        <button class="backend-alert-close" id="backend-alert-close" aria-label="Cerrar aviso">×</button>
      </div>
      <div class="backend-alert-body">
        <div id="backend-alert-message">Se ha detectado un error de conexión.</div>
        <div class="backend-alert-help" id="backend-alert-help"></div>
      </div>
    </div>

    <div class="viewer-wrap">
      <div style="width:100%;">
        <div id="sheet-tabs" class="sheet-tabs"></div>
        <div id="sheet-content" class="sheet-content">Cargando...</div>
      </div>
    </div>

  <script> 
    const { ipcRenderer } = require('electron');
    const XLSX = require('xlsx');
    let driveUrl = '';
    const backendAlert = document.getElementById('backend-alert');
    const backendAlertTitle = document.getElementById('backend-alert-title');
    const backendAlertMessage = document.getElementById('backend-alert-message');
    const backendAlertHelp = document.getElementById('backend-alert-help');
    const backendAlertClose = document.getElementById('backend-alert-close');

    const BD_LOG_PREFIX = '[Frontend-BD]';

    function bdLog(level = 'log', message = '', data = undefined) {
      const normalizedLevel = String(level || '').toLowerCase();
      if (normalizedLevel !== 'error') {
        return;
      }

      const method = 'error';
      const timestamp = new Date().toISOString();
      if (data === undefined) {
        console[method](`${BD_LOG_PREFIX} ${timestamp} ${message}`);
        return;
      }
      console[method](`${BD_LOG_PREFIX} ${timestamp} ${message}`, data);
    }

    function serializeError(error) {
      if (!error) return null;
      return {
        message: error.message,
        name: error.name,
        stack: error.stack
      };
    }

    window.addEventListener('error', (event) => {
      bdLog('error', 'window.error', {
        message: event?.message,
        filename: event?.filename,
        lineno: event?.lineno,
        colno: event?.colno,
        error: serializeError(event?.error)
      });
    });

    window.addEventListener('unhandledrejection', (event) => {
      bdLog('error', 'window.unhandledrejection', {
        reason: serializeError(event?.reason) || event?.reason
      });
    });

    function setStatus(message, type = 'loading') {
      bdLog(type === 'error' ? 'error' : 'log', 'setStatus', { message, type });
      const el = document.getElementById('status');
      if (!el) return;
      el.textContent = message;
      el.className = `status ${type}`;

      if (type === 'error') {
        showBackendAlert(message);
      }
    }

    function classifyBackendError(input = '') {
      const text = String(input || '').toLowerCase();
      const hasBackendConnectivityIssue = (
        text.includes('network error')
        || text.includes('econnrefused')
        || text.includes('econnreset')
        || text.includes('etimedout')
        || text.includes('timeout')
        || text.includes('failed to fetch')
        || text.includes('502')
        || text.includes('503')
        || text.includes('504')
        || text.includes('backend')
        || text.includes('error interno del servidor')
      );

      if (hasBackendConnectivityIssue) {
        return {
          title: 'No se pudo contactar con el backend',
          help: 'Parece una caída o problema temporal del backend.\n\nQué hacer:\n1) Espera 1-2 minutos y vuelve a intentar.\n2) Si persiste, avisa a bgoptimizing@gmail.com con una captura del error.'
        };
      }

      const hasPermissionIssue = (
        text.includes('403')
        || text.includes('forbidden')
        || text.includes('permiso')
        || text.includes('permisos')
        || text.includes('solo administradores')
        || text.includes('acceso denegado')
      );

      if (hasPermissionIssue) {
        return {
          title: 'No tienes permisos suficientes',
          help: 'Tu usuario no tiene permisos para esta acción.\n\nQué hacer:\n1) Verifica que hayas iniciado sesión con la cuenta correcta.\n2) Pide al administrador que comparta la carpeta/función necesaria en Google Drive.\n3) Si debe funcionar y no funciona, escribe a bgoptimizing@gmail.com.'
        };
      }

      return null;
    }

    function showBackendAlert(message = '') {
      if (!backendAlert || !backendAlertTitle || !backendAlertMessage || !backendAlertHelp) return;
      const classified = classifyBackendError(message);
      if (!classified) return;
      backendAlertTitle.textContent = classified.title;
      backendAlertMessage.textContent = String(message || 'Se ha producido un error en el backend.');
      backendAlertHelp.textContent = classified.help;
      backendAlert.classList.add('active');
    }

    if (backendAlertClose) {
      backendAlertClose.addEventListener('click', () => {
        backendAlert.classList.remove('active');
      });
    }

    function renderWorkbook(workbook) {
      const tabsEl = document.getElementById('sheet-tabs');
      const contentEl = document.getElementById('sheet-content');
      const sheetNames = workbook?.SheetNames || [];

      bdLog('log', 'renderWorkbook:start', {
        totalSheets: sheetNames.length,
        sheetNames
      });

      if (!sheetNames.length) {
        contentEl.innerHTML = '<p>No hay hojas para mostrar.</p>';
        return;
      }

      const showSheet = (name) => {
        bdLog('log', 'renderWorkbook:showSheet', { name });
        const sheet = workbook.Sheets[name];
        contentEl.innerHTML = XLSX.utils.sheet_to_html(sheet, { editable: false });
        Array.from(tabsEl.querySelectorAll('.sheet-tab')).forEach(tab => {
          tab.classList.toggle('active', tab.dataset.sheet === name);
        });
      };

      tabsEl.innerHTML = '';
      sheetNames.forEach((name, idx) => {
        const btn = document.createElement('button');
        btn.className = 'sheet-tab';
        btn.textContent = name;
        btn.dataset.sheet = name;
        btn.addEventListener('click', () => showSheet(name));
        tabsEl.appendChild(btn);
        if (idx === 0) showSheet(name);
      });
    }

    async function loadExcelFromDrive() {
      setStatus('Buscando el Excel en Drive...', 'loading');
      bdLog('log', 'loadExcelFromDrive:start');

      const excel = await ipcRenderer.invoke('get-drive-proveedores-excel');
      driveUrl = `https://drive.google.com/file/d/${excel.fileId}/view`;

      bdLog('log', 'loadExcelFromDrive:file-metadata', {
        fileId: excel.fileId,
        fileName: excel.fileName,
        mimeType: excel.mimeType,
        base64Length: excel?.dataBase64?.length || 0
      });

      const binaryString = atob(excel.dataBase64 || '');
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

      const workbook = XLSX.read(bytes, { type: 'array' });
      bdLog('log', 'loadExcelFromDrive:workbook-parsed', {
        totalSheets: workbook?.SheetNames?.length || 0
      });
      renderWorkbook(workbook);
      setStatus('Excel cargado correctamente (solo lectura).', 'success');
    }

    // Botón atrás: cerrar esta ventana secundaria sin recargar la principal
    const backBtn = document.getElementById('back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        bdLog('log', 'back button:click');
        if (window.opener) {
          window.close();
          return;
        }

        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        window.close();
      });
    }


    const openDriveBtn = document.getElementById('open-drive-btn');
    if (openDriveBtn) {
      openDriveBtn.addEventListener('click', async () => {
        bdLog('log', 'open drive button:click', { hasDriveUrl: Boolean(driveUrl) });
        if (!driveUrl) {
          setStatus('Aún no se ha cargado el enlace del archivo.', 'error');
          return;
        }
        await ipcRenderer.invoke('open-external', driveUrl);
        bdLog('log', 'open drive button:ok', { driveUrl });
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      bdLog('log', 'DOMContentLoaded');
      loadExcelFromDrive().catch((error) => {
        bdLog('error', 'loadExcelFromDrive:error', serializeError(error));
        console.error(error);
        setStatus(error.message || 'No se pudo cargar el Excel.', 'error');
      });
    });
  </script>
</body>
</html>
