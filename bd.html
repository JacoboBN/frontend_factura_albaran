<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bases de datos - Proveedores</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border: 1px solid #ccc;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      border-radius: 10px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .header h1 {
      color: #333;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .viewer-wrap {
      border: 1px solid #d3d3d3;
      border-radius: 10px;
      overflow: hidden;
      background: #fafafa;
      min-height: 70vh;
      padding: 12px;
    }

    .sheet-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .sheet-tab {
      border: 1px solid #ccc;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .sheet-tab.active {
      background: #007bff;
      border-color: #007bff;
      color: #fff;
    }

    .sheet-content {
      overflow: auto;
      max-height: calc(70vh - 30px);
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
    }

    .sheet-content table {
      border-collapse: collapse;
      font-size: 12px;
    }

    .sheet-content td,
    .sheet-content th {
      border: 1px solid #d5d5d5;
      padding: 4px 6px;
      white-space: nowrap;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      text-decoration: none;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .status {
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .status.loading {
      display: block;
      background: #d1ecf1;
      color: #0c5460;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Bases de datos</h1>
        <div class="subtitle">Archivo: CORREGIDO_Maestro Proveedores.xlsx</div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="back-btn">Volver</button>
        <button class="btn" id="open-drive-btn">Abrir en Drive</button>
      </div>
    </div>

    <div id="status" class="status loading">Buscando el Excel en Drive...</div>

    <div class="viewer-wrap">
      <div style="width:100%;">
        <div id="sheet-tabs" class="sheet-tabs"></div>
        <div id="sheet-content" class="sheet-content">Cargando...</div>
      </div>
    </div>

  <script>
    const { ipcRenderer } = require('electron');
    const XLSX = require('xlsx');
    let driveUrl = '';

    function setStatus(message, type = 'loading') {
      const el = document.getElementById('status');
      if (!el) return;
      el.textContent = message;
      el.className = `status ${type}`;
    }

    function renderWorkbook(workbook) {
      const tabsEl = document.getElementById('sheet-tabs');
      const contentEl = document.getElementById('sheet-content');
      const sheetNames = workbook?.SheetNames || [];

      if (!sheetNames.length) {
        contentEl.innerHTML = '<p>No hay hojas para mostrar.</p>';
        return;
      }

      const showSheet = (name) => {
        const sheet = workbook.Sheets[name];
        contentEl.innerHTML = XLSX.utils.sheet_to_html(sheet, { editable: false });
        Array.from(tabsEl.querySelectorAll('.sheet-tab')).forEach(tab => {
          tab.classList.toggle('active', tab.dataset.sheet === name);
        });
      };

      tabsEl.innerHTML = '';
      sheetNames.forEach((name, idx) => {
        const btn = document.createElement('button');
        btn.className = 'sheet-tab';
        btn.textContent = name;
        btn.dataset.sheet = name;
        btn.addEventListener('click', () => showSheet(name));
        tabsEl.appendChild(btn);
        if (idx === 0) showSheet(name);
      });
    }

    async function loadExcelFromDrive() {
      setStatus('Buscando el Excel en Drive...', 'loading');

      const excel = await ipcRenderer.invoke('get-drive-proveedores-excel');
      driveUrl = `https://drive.google.com/file/d/${excel.fileId}/view`;

      const binaryString = atob(excel.dataBase64 || '');
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

      const workbook = XLSX.read(bytes, { type: 'array' });
      renderWorkbook(workbook);
      setStatus('Excel cargado correctamente (solo lectura).', 'success');
    }

    // Botón atrás: cerrar esta ventana secundaria sin recargar la principal
    const backBtn = document.getElementById('back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        if (window.opener) {
          window.close();
          return;
        }

        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        window.close();
      });
    }


    const openDriveBtn = document.getElementById('open-drive-btn');
    if (openDriveBtn) {
      openDriveBtn.addEventListener('click', async () => {
        if (!driveUrl) {
          setStatus('Aún no se ha cargado el enlace del archivo.', 'error');
          return;
        }
        await ipcRenderer.invoke('open-external', driveUrl);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadExcelFromDrive().catch((error) => {
        console.error(error);
        setStatus(error.message || 'No se pudo cargar el Excel.', 'error');
      });
    });
  </script>
</body>
</html>
