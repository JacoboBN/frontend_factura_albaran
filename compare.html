<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparar - DriveShare</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border: 1px solid #ccc;
      max-width: 600px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }

    .header {
      margin-bottom: 30px;
      position: relative;
    }

    .header h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .back-btn {
      position: absolute;
      top: 0;
      left: 0;
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn:hover {
      background: #5a6268;
    }

    .compare-form {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .file-upload {
      flex: 1;
      border: 1px solid #ccc;
      padding: 24px;
      text-align: center;
      cursor: pointer;
    }

    .file-upload p {
      color: #666;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .file-upload .file-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .file-upload input[type="file"] {
      display: none;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0056b3;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 90%;
      max-width: 1200px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
    }

    .text-comparison {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .text-box {
      flex: 1;
      border: 1px solid #ccc;
      padding: 15px;
      background: #f9f9f9;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 400px;
      overflow-y: auto;
    }

    .text-box h3 {
      margin-bottom: 10px;
      color: #333;
    }

    .comparison-result {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      font-weight: bold;
    }

    .match {
      color: green;
    }

    .no-match {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="user.html" class="back-btn">← Atrás</a>
      <h1>Analizar Documento</h1>
      <p style="color: #666;">Sube un documento para obtener un resumen con IA</p>
    </div>

    <div class="upload-section">
      <div class="file-upload" onclick="document.getElementById('document-file').click()">
        <div class="file-icon">📄</div>
        <p>Seleccionar documento</p>
        <input type="file" id="document-file">
      </div>
    </div>

    <button class="btn" id="analyze-btn">Analizar</button>
  </div>

  <!-- Modal for displaying analysis results -->
  <div id="analysis-modal" class="modal">
    <div class="modal-content">
      <span class="close" id="close-modal">&times;</span>
      <h2>Resumen del Documento</h2>

      <div class="analysis-result">
        <div class="text-box">
          <h3>Resumen generado por IA</h3>
          <div id="summary-text"></div>
        </div>
      </div>

      <div class="analysis-info" id="analysis-info"></div>
    </div>
  </div>

  <script>
    // Modal functionality
    const modal = document.getElementById('analysis-modal');
    const closeBtn = document.getElementById('close-modal');

    closeBtn.onclick = function() {
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }

    // File input handler
    document.getElementById('document-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const uploadDiv = e.target.parentElement;
        uploadDiv.querySelector('p').textContent = file.name;
      }
    });

    // Main analyze function
    document.getElementById('analyze-btn').addEventListener('click', async function() {
      const file = document.getElementById('document-file').files[0];

      if (!file) {
        alert('Por favor selecciona un archivo.');
        return;
      }

      // Validate file types (PDF, images, or text files)
      const allowedExtensions = ['pdf', 'jpg', 'jpeg', 'png', 'bmp', 'tiff', 'txt'];
      const ext = file.name.split('.').pop().toLowerCase();

      if (!allowedExtensions.includes(ext)) {
        alert('Solo se pueden analizar archivos PDF, imágenes (JPG, PNG, etc.) o archivos de texto.');
        return;
      }

      // Show loading
      this.disabled = true;
      this.textContent = 'Procesando...';

      try {
        const formData = new FormData();
        formData.append('file', file);

        // const response = await fetch('http://localhost:10000/analyze/document', {
        //   method: 'POST',
        //   body: formData
        // });

        const response = await fetch('https://backend-factura-albaran.onrender.com/analyze/document', {
          method: 'POST',
          body: formData
        });


        if (!response.ok) {
          throw new Error(`Error en análisis: ${response.status}`);
        }

        const result = await response.json();

        // Display results in modal
        document.getElementById('summary-text').textContent = result.summary || 'No se pudo generar resumen';
        document.getElementById('analysis-info').innerHTML = `
          <p><strong>Calidad OCR:</strong> ${(result.ocrQuality * 100).toFixed(1)}%</p>
          <p><strong>Modelo usado:</strong> ${result.modelUsed}</p>
        `;

        // Show modal
        modal.style.display = 'block';

      } catch (error) {
        alert('Error al analizar el archivo: ' + error.message);
      } finally {
        // Reset button
        this.disabled = false;
        this.textContent = 'Analizar';
      }
    });
  </script>
</body>
</html>
