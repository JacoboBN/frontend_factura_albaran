<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveShare - Usuario final</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      color: #1f1f1f;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .login-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn.small {
      padding: 6px 10px;
      font-size: 13px;
    }

    .app {
      min-height: 100vh;
      display: flex;
      background: #f5f5f5;
    }

    .sidebar {
      width: 20%;
      min-width: 230px;
      max-width: 280px;
      background: #d4d4d4;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #bcbcbc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: #333;
    }

    .profile-info .label {
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      color: #444;
    }

    .profile-info .value {
      font-size: 12px;
      color: #222;
      word-break: break-all;
    }

    .profile-info .placeholder {
      color: #666;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-item {
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: #e0e0e0;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #222;
    }

    .menu-item:hover {
      background: #c9c9c9;
    }

    .panel {
      background: #efefef;
      padding: 10px;
      border-radius: 8px;
    }

    .folder-tree {
      max-height: 320px;
      overflow: auto;
      padding: 6px 0;
    }

    .folder-tree div {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
    }

    .folder-tree div:hover {
      background: #dcdcdc;
    }

    .main {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .breadcrumbs {
      color: #666;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 16px;
    }

    .tile {
      background: #ffffff;
      border: 1px solid #d1d1d1;
      border-radius: 12px;
      padding: 24px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .tile:hover {
      background: #f0f0f0;
    }

    .tile.disabled {
      cursor: not-allowed;
      background: #f5f5f5;
      color: #999;
    }

    .files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .file-tile {
      background: #fff;
      border: 1px solid #ccc;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 8px;
    }

    .file-tile .name {
      font-size: 14px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-tile .meta {
      font-size: 12px;
      color: #666;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      display: block;
    }

    .queue-panel {
      background: #ffffff;
      border: 1px solid #d1d1d1;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
    }

    .queue-panel h3 {
      margin-bottom: 12px;
      font-size: 16px;
      color: #333;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .queue-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .queue-item .file-name {
      font-weight: 600;
      color: #222;
      font-size: 14px;
    }

    .queue-item .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: #444;
    }

    .queue-step {
      padding: 4px 8px;
      border-radius: 12px;
      background: #e0e0e0;
    }

    .queue-step.active {
      background: #d1ecf1;
      color: #0c5460;
      font-weight: 600;
    }

    .queue-step.done {
      background: #d4edda;
      color: #155724;
      font-weight: 600;
    }

    .queue-step.error {
      background: #f8d7da;
      color: #721c24;
      font-weight: 600;
    }

    .startup-status {
      background: #fff8e1;
      border: 1px solid #f0d88c;
      color: #7a5b00;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 8px;
    }

    .startup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 15, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .startup-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .startup-overlay-card {
      background: #ffffff;
      padding: 32px 40px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-width: 280px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .startup-spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 6px solid #e0e0e0;
      border-top-color: #007bff;
      animation: spin 1s linear infinite;
    }

    .startup-overlay-title {
      font-size: 18px;
      font-weight: 700;
      color: #1f1f1f;
    }

    .startup-overlay-message {
      font-size: 14px;
      color: #555;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
    <div id="status" class="status"></div>

    <div class="startup-overlay" id="startup-overlay">
      <div class="startup-overlay-card">
        <div class="startup-spinner"></div>
        <div class="startup-overlay-title">Revisando carpetas...</div>
        <div class="startup-overlay-message" id="startup-overlay-message">
          Preparando la sincronización con Drive.
        </div>
      </div>
    </div>

    <!-- Login Section -->
    <div class="section active" id="login-section">
      <div class="login-section">
        <h1>BGO</h1>
        <p style="color: #666;">Inicia sesión con Google para comenzar</p>
        <button class="btn" id="login-btn">Iniciar sesión con Google</button>
      </div>
    </div>

    <!-- Upload Section with folder browser -->
    <div class="section" id="upload-section">
      <div class="app">
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">👤</div>
            <div class="profile-info">
              <div class="label">Email de la nube</div>
              <div class="value" id="user-email"></div>
              <div class="label">Email de Facturas</div>
              <div class="value placeholder" id="billing-email">Pendiente</div>
            </div>
          </div>

          <nav class="menu">
            <button class="menu-item" data-action="open-albaranes">Albaranes</button>
            <button class="menu-item" data-action="open-facturas">Facturas</button>
            <button class="menu-item" data-action="upload-albaran">Subir Albarán</button>
            <button class="menu-item" data-action="upload-factura">Subir Factura</button>
          </nav>

          <button class="btn btn-secondary small" id="logout-btn">Cerrar sesión</button>
        </aside>

        <main class="main">
          <div class="topbar">
            <div class="nav">
              <button id="back-btn" class="btn small">Atrás</button>
              <div id="breadcrumbs" class="breadcrumbs"></div>
            </div>
            <!-- <div class="actions">
              <a href="compare.html"><button class="btn">Comparar</button></a>
            </div> -->
          </div>

          <section class="dashboard">
            <button class="tile disabled" data-action="centros" disabled>Centros</button>
            <button class="tile" data-action="bases-datos">Bases de datos</button>
            <button class="tile" data-action="facturas">Facturas</button>
            <button class="tile" data-action="albaranes">Albaranes</button>
          </section>

          <section class="content">
            <div id="folder-summary" class="panel"></div>
            <div id="files-list" class="files-grid"></div>
            <div class="startup-status" id="startup-status">Estado de inicio: esperando...</div>
            <div class="queue-panel" id="upload-queue-panel">
              <h3>Seguimiento de archivos</h3>
              <div class="queue-list" id="upload-queue-list">
                <p style="color:#666">No hay archivos en cola.</p>
              </div>
            </div>
          </section>

        </main>
      </div>
    </div>
  
  <script src="user.js"></script>
</body>
</html>
